[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "aster-crypto"
version = "0.1.0"
description = "Causal crypto research and event simulation"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=2.2", "pyarrow>=17", "plotly>=5.24", "streamlit>=1.40", "PyYAML>=6"]
[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["statsmodels==0.14.6"]
[project.scripts]
aster = "aster.cli:main"
[tool.setuptools.packages.find]
include = ["aster*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
